[project]
name = "movielens-pipeline"
version = "0.1.0"
description = "A modular, extensible data-science pipeline for the MovieLens 32M dataset (class project)."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# Proprietary, all rights reserved — see LICENSE. This classifier tells build
# tools to refuse any attempt to upload the package to a public index (PyPI).
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyarrow>=24.0.0",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "movielens"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
